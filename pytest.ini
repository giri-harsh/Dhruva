[pytest]
# `pytest` from the repo root runs the ML track's tests and the model-IO
# contract test together. The backend-api contract check is a git-diff check,
# not pytest — run it via: python contracts/backend_api/stub_api.py && git diff --exit-code -- contracts/backend_api/openapi.json
testpaths =
    ml/tests
    contracts/model_io
pythonpath =
    ml
filterwarnings =
    ignore::DeprecationWarning
