# See TOOLCHAIN.md for why every version below is pinned where it appears
# (libs.versions.toml) rather than here -- this file is JVM/daemon config
# only, not dependency versions.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin's official incremental-compilation flags -- safe defaults for a
# small multi-module project, not a perf tune.
kotlin.incremental=true
android.useAndroidX=true
# AGP 9's built-in Kotlin support (TOOLCHAIN.md) -- explicit, not relying on
# whatever AGP 9.3.0 defaults to, so a later AGP bump can't silently change
# this project's Kotlin-application model out from under it.
android.builtInKotlin=true
